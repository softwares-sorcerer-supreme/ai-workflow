# ai-runner config. Tokens are NOT here: the dashboard's Setup page (or dotnet user-secrets) keeps them; see README.
# web_password may still be here for old setups; the Setup page is preferred (a saved one wins over this one).
# All keys are snake_case. An unknown or misspelled key stops the start, with a hint.
code_host:                  # the old name 'git_bucket:' (without kind) still works; not both
  kind: gitbucket           # the only provider so far
  base_url: http://10.221.10.34:3000
  web_password: "admin@123"          # sign-in password of the token's user: closes issues via the web page (the API cannot)

poll_interval_seconds: 90
runner_name: ""             # names this runner in claims (claim_enabled); empty = the machine user name

copilot:
  analyze_timeout_minutes: 30
  review_timeout_minutes: 30
  implement_timeout_minutes: 60  # per Copilot run; the agent now builds, tests, lints and reviews itself inside it
  extra_args: [--disable-builtin-mcps, --allow-all-tools]   # no GitHub MCP server; every tool allowed, but the runner's --deny-tool rules (git, .ai-workflow, analyze/review write+shell) still win
  command: C:\Users\70024980\AppData\Roaming\npm\copilot.cmd

agent_models:               # model per subagent, written into the installed copy under ~/.copilot/agents (sync after a change)
  code-reviewer: claude-haiku-5.5   # the review inside implement/fix (~20% of an implement); pr-review still checks the PR with the main model

# Relative to this file.
paths:
  work: work                # work/<project>/<repo>: one clone per repo, reset before each job
  logs: logs                # logs/jobs/<run>/ (kept log_retention_days) and logs/cost.csv
  state: ai-runner.db       # SQLite; deleting it is safe
log_retention_days: 30

attachments:                # files people attach to issues, comments and PRs (links with /_attached/ on the GitBucket host)
  enabled: true             # download them into .ai-workflow/attachments/ of the project folder so the agent can read them
  max_file_bytes: 10485760  # 10 MB per file; larger files are listed as "too large", never kept
  max_files: 20             # per job
  max_total_bytes: 52428800 # 50 MB per job
  pass_to_copilot: true     # also give images and PDFs to the prompt (copilot --attachment); needs a Copilot CLI that has the flag
  max_passed_to_copilot: 5  # each file on the prompt costs tokens
  skip_extensions: [.exe, .dll, .msi, .bat, .cmd, .ps1, .sh, .com, .scr, .jar, .vbs]   # never downloaded

dashboard:                  # local read-only status page; build it once with ./build-dashboard.ps1
  enabled: true            # only the polling loop serves it (never --once or --dry-run)
  port: 5180                # http://localhost:5180/, 127.0.0.1 only

git:                        # author of the commits the runner makes in Workflow 2
  user_name: ai-runner
  user_email: ai-runner@localhost

# Settings every project gets. A project overrides only the keys it names: objects merge key by key, lists replace.
# `commands` is not allowed here (a global command would assume a stack).
defaults:
  trigger_label: ai         # the runner only looks at issues with this label (or assigned to the runner's user)
  trigger_keyword: "@ai"    # the word that asks the bot for something in a comment
  # analyze = Workflow 1, breakdown = 1b, implement = 2, review = 3, fix = 3b (the keyword on a PR: Copilot fixes it and
  # pushes a commit when build/test pass; needs commands.build or commands.test of the component)
  workflows: [analyze, review, breakdown, implement, fix]
  models:                          # only workflows that run Copilot; the breakdown table comes from the analysis
    analyze: claude-opus-5.5       # strongest reasoning for issue analysis (and its breakdown)
    implement: claude-sonnet-5.5   # capable coding at a lower cost than Opus
    review: claude-sonnet-5.5      # inspect changes and identify risks
    fix: claude-sonnet-5.5         # apply targeted review fixes
  limits:
    max_changed_files: 20
    max_diff_lines: 2000
    max_analysis_rounds: 7
    max_review_fixes: 7     # review fixes per PR; each is 1+ Copilot runs (fix rounds as in implement)
    max_reviews: 3          # automatic reviews per PR (the first is full, later ones only the new commits);
                            # the label ai-review-full asks for one more full review outside this limit
  implement:
    max_fix_rounds: 5       # after the agent stops, the runner re-runs build/test/lint and checks PR_BODY.md; on a problem it starts
                            # up to this many extra Copilot runs with fix.md. 0 = WIP PR at once; a round that ends with
                            # the same failing checks as the one before stops the rounds early (no progress)
                            # the review fix (workflow fix) uses the same number of fix rounds
  review:
    scope: scoped           # scoped (default) = PRs labelled with trigger_label + PRs this runner opened from ai/* or feat/issue-*; all = every open PR
    skip_paths: ["docs/**", "**/*.md"]   # a PR that changes only these files is not reviewed
  never_edit: []            # files the agent must not change (gitignore-like); such edits are undone. e.g. [migrations/, Jenkinsfile, .github/]
  auto_start_first_sub_issue: false      # true = the breakdown adds ai-implement on the first sub-issue
  claim_enabled: false      # true = several runners share the projects; a job claims its issue or PR first

# A project groups components (a repo plus an optional folder). Issues and sub-issues live in `issues_in` only.
# Every job checks out all components, but changes code in one.
projects:
  mbh:
    issues_in: issues       # the component whose repo receives the issues
    context: PROJECT.md     # optional description of the project, inside the issues component
    components:
      issues:               # holds issues and docs only: never changed, never gets a PR
        repo: manhhai/mbh-issues
        path: .
        code: false
      backend:
        repo: manhhai/mbhanalytics
        path: .
        instructions: [AGENTS.md]   # files whose content the runner puts in front of the agent (relative to the component folder); default [AGENTS.md]
        commands:           # any stack; the same commands as in the repo's AGENTS.md. Empty = not used
          setup: ""         # runs after each checkout (the work folder is cleaned, so node_modules etc. are gone), e.g. "npm ci"
          build: "dotnet build MBHAnalytics.sln"
          test: "dotnet test MBHAnalytics.sln"
          lint: "dotnet format --verify-no-changes"     # optional
                            # the agent may run the TOOL of each command with any arguments (dotnet build ... -> shell(dotnet:*)); never git
          allow_shell: [Get-ChildItem:*, Get-Content:*, Select-Object:*, Select:*, Select-String:*, cd:*, New-Item:*, Move-Item:*, mkdir:*, mv:*, Out-Null:*, Test-Path:*, Join-Path:*, Split-Path:*, Where-Object:*, ForEach-Object:*, Sort-Object:*, Copy-Item:*]
          run_in: component # component = in the component folder (default); repo = at the root of the clone
      frontend:
        repo: manhhai/mbhanalytics-fe
        path: .
        instructions: [AGENTS.md]   # a second file is possible, e.g. [AGENTS.md, design-system/mbh-analytics/MASTER.md]; each file costs context on every job of this component
        commands:
          setup: "npm ci"
          build: "npm run build"
          test: "npm test"
          lint: "npm run lint && npx prettier --check ."   # type check plus formatting; ESLint would be a better lint if the repo adds it
          allow_shell: [Get-ChildItem:*, Get-Content:*, Select-Object:*, Select:*, Select-String:*, cd:*, New-Item:*, Move-Item:*, mkdir:*, mv:*, Out-Null:*, Test-Path:*, Join-Path:*, Split-Path:*, Where-Object:*, ForEach-Object:*, Sort-Object:*, Copy-Item:*]
          run_in: component
